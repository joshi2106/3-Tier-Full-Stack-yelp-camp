name: CI/CD Pipeline - YelpCamp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: joshi2106/testcamp:latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. SonarQube Analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=CampProject
            -Dsonar.projectName=CampProject

      # 3. SonarQube Quality Gate
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 4. Docker Build & Push Preparation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: docker build -t ${{ env.DOCKER_IMAGE }} .

      # 5. Trivy Image Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}
          format: table
          output: trivy-report.txt
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-report.txt

      # 6. Push Docker Image
      - name: Docker Push Image
        run: docker push ${{ env.DOCKER_IMAGE }}

      # 7. Deploy to EC2 via SSH
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull joshi2106/testcamp:latest

            docker stop testcamp || true
            docker rm testcamp || true

            docker run -d -p 3000:3000 \
              --name testcamp \
              -e CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
              -e CLOUDINARY_KEY=${{ secrets.CLOUDINARY_KEY }} \
              -e CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }} \
              -e MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }} \
              -e DB_URL=${{ secrets.DB_URL }} \
              joshi2106/testcamp:latest

      # 8. Email Notification
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: syamjoshikalaga@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "${{ job.status }}: ${{ github.workflow }} #${{ github.run_number }}"
          body: |
            Status: ${{ job.status }}

            Workflow: ${{ github.workflow }}
            Build Number: ${{ github.run_number }}
            Triggered By: ${{ github.actor }}
            Branch: ${{ github.ref_name }}

            Details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
